[project]
name = "medical-nudging"
version = "0.1.0"
description = "Medical nudging solution using AI agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Core agent framework
    "strands-agents[otel]==1.51.0",  # With OpenTelemetry support for tracing
    "strands-shell==0.3.3",

    # AgentCore deployment
    "bedrock-agentcore>=1.1.0",                  # AgentCore SDK
    "bedrock-agentcore-starter-toolkit>=0.2.5", # Deploy helpers and CLI

    # Observability (OTEL)
    "aws-opentelemetry-distro>=0.10.0",  # AWS Distro for OpenTelemetry

    # Web framework (for AgentCore HTTP server)
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "httpx>=0.26.0",

    # AWS
    "boto3>=1.34.0",

    # Data validation
    "pydantic>=2.0.0",

    # Clinical data parsing
    "pyCCDA>=2.0.0",
    "lxml>=4.6.0",

    # CLI and output
    "rich",

    # Caching
    "diskcache>=5.6.0",

    # OpenSearch
    "opensearch-py>=2.4.0",
    "requests-aws4auth>=1.2.0",

    # Configuration
    "python-dotenv>=1.0.0",

]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "black",
    "ruff",
    "mypy",
    "pre-commit",
    "lxml-stubs",
]
evals = [
    # Layered evaluation harness and Experiment runner.
    "strands-agents-evals==1.1.1",
    # AgentCore Evaluations SDK: dataset management, on-demand dataset runner,
    # CloudWatch span collection (the candidate-acceptance gate).
    "bedrock-agentcore[datasets]>=1.23.0",
]
ingest = [
    "docling>=2.0.0",
    "docling-core>=2.0.0",
    "scipy<1.17",  # 1.17+ has no manylinux2014 wheel, requires OpenBLAS to build from source
    "pyyaml>=6.0.0",
]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medical_nudging"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["bedrock_agentcore", "bedrock_agentcore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# strands-shell does not ship a py.typed marker.
module = ["strands_shell", "strands_shell.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# strands-agents-evals ships no py.typed marker.
module = ["strands_evals", "strands_evals.*"]
ignore_missing_imports = true
